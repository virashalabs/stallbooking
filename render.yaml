# Render Blueprint: free web service (same setup as studio.virashalabs.online).
# Note: the free plan's disk is wiped on every deploy/restart, so the site resets to the
# setup in seed/ (event, layout, poster, payment QR, settings) and bookings made on the live
# site are lost. For real bookings, switch to plan: starter and add a persistent disk:
#   disk:
#     name: stall-data
#     mountPath: /var/data
#     sizeGB: 1
# and set DATA_DIR=/var/data.
services:
  - type: web
    name: stall-booking
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/site
    envVars:
      - key: NODE_VERSION
        value: "24.15.0"
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
