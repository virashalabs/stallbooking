# Opens the site every few minutes so Render's free plan doesn't put it to sleep
# (it sleeps after 15 minutes without visitors). Runs on GitHub's servers.
# GitHub may start scheduled runs late, and it pauses them after 60 days without
# commits; re-enable from the repo's Actions tab if that happens.
name: Keep site awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping stall.virashalabs.online
        run: curl -fsS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" --max-time 90 --retry 2 https://stall.virashalabs.online/api/site
